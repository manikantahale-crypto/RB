# CI — the checks every PR must pass.
#
# This repository had no CI before this file. Jobs are named so a red build
# says which rule broke, not just "CI failed".
#
# Nothing here needs a database, a network service, or an API key, and no test
# may ever call a real LLM.
#
# First slice. Still to come: the fixture runner, the event-chain
# check, and routing simulation against committed expected outcomes — each
# becomes another named job here.

name: CI

on:
  pull_request:
  push:
    branches:
      - feature/unified-sao-orch
      - feature/orch-authoring-platform

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: node contract — the constitution
        run: npm run typecheck -w @tekisho/node-contract

      - name: routing contract
        run: npm run typecheck -w @tekisho/routing-contract

      - name: graph contract
        run: npm run typecheck -w @tekisho/graph-contract

      - name: authoring
        run: npm run typecheck -w @tekisho/authoring

      - name: admin UI
        run: npm run typecheck -w @tekisho/admin

      # Both guards existed and neither ran anywhere but a laptop, which is the
      # same as not existing the first time somebody is in a hurry.
      - name: admin UI — raw colours outside tokens.css
        run: npm run check:tokens -w @tekisho/admin

      - name: admin UI — a screen's classes in another screen's stylesheet
        run: npm run check:styles -w @tekisho/admin

      - name: admin API
        run: npm run typecheck -w @tekisho/admin-api

      - name: adapters — every *.node.ts
        run: npm run typecheck:adapters

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Runs every workspace with a test script. Packages without tests pass
      # rather than fail — see passWithNoTests in their vitest configs.
      #
      # Note for anyone adding tests: the orchestrator and authoring configs
      # used to match only `tests/**`, so a test written beside the code was
      # silently skipped while this job stayed green. Both now match either
      # layout. If you add a test and the count here does not go up, that is
      # the first thing to check.
      - name: unit tests
        run: npm test --workspaces --if-present

      # node-api is NOT a workspace — `workspaces` is apps/* and packages/*
      # only — so the step above never reaches it, and a test written there is
      # invisible to CI while this job stays green. That is the same failure
      # the note above describes, one level further out.
      #
      # This runs the module-boundary check explicitly: every file resolves,
      # no application imports another, and nothing imports the composition
      # root. Adding node-api to `workspaces` would do it too, and would also
      # change how npm installs and hoists for another team's service, so it is
      # named here instead.
      - name: node-api — module boundaries
        run: npx vitest run node-api/structure.test.js

      # adapters/README.md has always said filenames derive from a node's key
      # "so registry:check can verify a file sits where its key says". That
      # script did not exist, and typecheck:adapters proves only that the
      # contracts compile — not where they live, and not that anything loads
      # them. A convention nobody checks is a habit, and habits drift.
      - name: adapters — every contract where its key says
        run: npm run check:registry

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WILL FAIL until two pre-existing files are sanitised:
      #   .env.example          — a real-looking Supabase URL and password
      #   packages/db/flyway.conf — flyway.password
      # Both are already pushed, so removing the line is not enough; the values
      # must be rotated. Blocking on purpose — a committed live credential is
      # not a warning.
      - name: scan tracked files
        run: bash .github/check-secrets.sh

  # ── Known debt ──────────────────────────────────────────────────────────
  # Non-blocking on purpose. A build red from day one gets ignored, and is then
  # worth nothing when a real break happens. The counts are in the step names
  # so they can be driven down and this job promoted into `typecheck`.
  #
  # Both counts share two root causes, neither introduced by recent work:
  #   packages/domain/events/platform-event.ts — generic index on EventPayloadMap
  #   packages/orchestrator/src/routing/table.ts — duplicate object literal keys
  # The worker inherits the engine's errors; fixing the engine fixes both.

  # ─────────────────────────────────────────────────────────────────────────
  # Can the database still be built from its migrations?
  #
  # Until 2026-09-09 the answer was no, and nobody knew: there was no
  # flyway_schema_history in any schema, two files both claimed V11 with
  # different primary key types, and eight versions existed twice under two
  # naming conventions. The tables had been created by hand instead, and the
  # files had quietly stopped describing the database.
  #
  # This applies every migration to an empty Postgres, in order. It does NOT
  # diff against production — that needs credentials CI should not hold, and it
  # stays a local command (scripts/rebuild-check.sh). What this catches is the
  # half that breaks most often: a migration that cannot run at all, or two
  # that claim the same version.
  schema:
    name: migrations build a database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rebuild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The failure that made the old folder unrunnable, caught before anything
      # touches a database. Two files claiming one version is not a conflict
      # Flyway resolves — it refuses the whole folder.
      - name: no two migrations claim the same version
        run: |
          dupes=$(ls packages/db/migrations/V*.sql                   | sed 's|.*/V||; s|__.*||' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration versions: $dupes"
            exit 1
          fi

      - name: apply every migration to an empty database
        env:
          PGPASSWORD: test
        run: |
          for f in packages/db/migrations/V*.sql; do
            echo "→ $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d rebuild -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null
          done
          echo "all migrations applied"

  known-debt:
    name: known debt (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: engine — 11 errors
        run: npm run typecheck -w @tekisho/orchestrator

      - name: worker — 11 errors, inherited from the engine
        run: npm run typecheck -w @tekisho/worker
