# No credentials in this file — it is tracked in git.
#
# Supply them at the command line or from the environment instead:
#   flyway -url=$FLYWAY_URL -user=$FLYWAY_USER -password=$FLYWAY_PASSWORD ...
# or export FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD, which Flyway reads
# directly.
#
# flyway.url=jdbc:postgresql://HOST:5432/postgres?sslmode=require
# flyway.user=USER
# flyway.password=  ← never set this here

flyway.locations=filesystem:packages/db/migrations

flyway.placeholders.app_role=syntra_app
flyway.placeholders.relay_role=syntra_relay
flyway.placeholders.migrator_role=syntra_migrator

flyway.validateMigrationNaming=true
flyway.cleanDisabled=true